.hero>*{position:relative}.hero svg{width:64px;fill:#fff;margin-bottom:10px}
.ey{font:500 11px 'JetBrains Mono',monospace;color:var(--aq);letter-spacing:.2em;text-transform:uppercase}
.hero h1{font-size:40px;font-weight:600;margin:6px 0}.hero h1 i{font:700 .6em 'Noto Serif JP',serif;color:var(--az);margin-left:12px;letter-spacing:.1em}
.hero p{color:var(--mut);max-width:560px;margin:0 auto}
.w{max-width:1180px;margin:0 auto;padding:32px 20px 70px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.b{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;font-weight:600;background:linear-gradient(180deg,#2bb4ee,#1580b8);color:#fff;box-shadow:inset 0 1px #fff6,0 6px 16px -6px #1e9fd8}.b:hover{filter:brightness(1.12)}
.b.g{background:#ffffff0f;box-shadow:inset 0 0 0 1px var(--ln);color:var(--ink)}.b.s{padding:5px 12px;font-size:12px}
.ad{display:none!important}body.adm .ad{display:inline-flex!important;color:var(--rd)}
.sl{display:flex;align-items:center;gap:12px;margin:30px 0 14px;font-size:20px}.sl::before{content:"";width:3px;height:20px;background:var(--aq)}.sl small{font:11px 'JetBrains Mono';color:var(--mut)}
.sh{display:flex;flex-wrap:wrap;gap:26px;padding-bottom:16px;border-bottom:6px solid #ffffff10;align-items:flex-end}
.bk{width:140px;cursor:pointer;transition:.3s;perspective:700px}.bk:hover{transform:translateY(-6px)}
.cv{height:182px;border-radius:3px 7px 7px 3px;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;background-size:cover;box-shadow:inset 6px 0 8px -4px #0008,0 14px 22px -10px #000c;transition:.35s;transform-origin:left}.bk:hover .cv{transform:rotateY(-22deg)}
.cv svg{width:30px;fill:currentColor;opacity:.85}.cv b{font:600 13px/1.2 'Cormorant Garamond',serif;letter-spacing:.04em}.bk p{font-size:11px;color:var(--mut);margin-top:8px;text-align:center}
.add{width:140px;height:182px;border:1.5px dashed var(--ln);border-radius:8px;display:grid;place-items:center;color:var(--mut);cursor:pointer}.add:hover{border-color:var(--aq);color:var(--aq)}
